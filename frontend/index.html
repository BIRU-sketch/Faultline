<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <title>Faultline — Agent Review</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      .waiting-state { max-width: 520px; margin: 15vh auto; padding: 32px; text-align: center; color: var(--muted); }
      .waiting-state h1 { color: var(--text); font: 600 22px Manrope, sans-serif; }
      .waiting-state p, .waiting-state small { line-height: 1.6; }
      .waiting-banner { display: flex; align-items: center; gap: 12px; margin: -8px 0 18px; padding: 13px 16px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--muted); }
      .waiting-banner b { color: var(--text); font-size: 12px; }
      .waiting-banner p { margin: 3px 0 0; font-size: 11px; }
      .loading-spinner { display: inline-block; width: 22px; height: 22px; flex: 0 0 22px; border: 2px solid var(--border-strong); border-top-color: var(--text); border-radius: 50%; animation: waiting-spin .8s linear infinite; }
      .waiting-banner .loading-spinner { width: 16px; height: 16px; flex-basis: 16px; }
      .live-progress-copy { flex: 1; min-width: 0; }
      .live-progress-copy small { display: block; margin-top: 5px; font: 9px 'DM Mono', monospace; color: var(--faint); }
      .live-progress-track { width: 100px; height: 4px; overflow: hidden; border-radius: 9px; background: var(--surface-2); }
      .live-progress-track i { display: block; height: 100%; background: var(--amber); transition: width .3s ease; }
      .score-attribution { display: block; margin: 3px 0 7px; color: var(--muted); font-size: 10px; line-height: 1.5; }
      .grade-methodology { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--border); color: var(--muted); font-size: 10px; line-height: 1.6; }
      .grade-methodology b { color: var(--text); font-size: 11px; }
      .grade-methodology p { margin: 7px 0; color: var(--text); }
      .grade-methodology ul { margin: 6px 0 0; padding-left: 17px; }
      .grade-methodology li + li { margin-top: 4px; }
      .tool-failure { color: var(--red); }
      @keyframes waiting-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <a class="brand" href="/" aria-label="Faultline home"><span class="brand-mark">F</span><span>FAULTLINE</span></a>
        <div class="rail-label">WORKSPACE</div>
        <a class="nav-item active" href="/"><span class="nav-icon">◫</span>Reviews</a>
        <div class="rail-note"><span class="pulse"></span><span>Local review environment</span></div>
        <div class="rail-bottom"><span class="rail-avatar">FL</span><span><b>Faultline</b><small>Agent security</small></span></div>
      </aside>
      <main class="main">
        <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <b id="crumb">Reviews</b></div><button class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme"><span id="theme-icon">☼</span><span id="theme-label">Light mode</span></button></header>
        <div class="content" id="app"><div class="loading">Loading review…</div></div>
        <footer>FAULTLINE <span>·</span> Private, local agent evaluations</footer>
      </main>
    </div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
